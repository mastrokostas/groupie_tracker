name: Build and push Images

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    # Allow runner to checkout code
    contents: read
    # Allow runner to push images to GHCR under my account
    packages: write

jobs:
    test:
        # Pick machine type
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              # Pulls conde into the runner
              uses: actions/checkout@v6

            - name: Set up Go
              # Installs Go in the runner
              uses: actions/setup-go@v6
              with:
                # Installs the go version in go.mod
                go-version-file: go.mod
                # Nothing to cahce
                cache: false
            
            - name: Run go vet
              run: go vet./...

            - name: Run unit tests
              run: go test ./...